[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["custom_components/ha_plus_matter_hub/runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
