name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      issues: write
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.setup.outputs.node-version }}
      release-version: ${{ steps.release.outputs.release-version }}
      release-channel: ${{ steps.release.outputs.release-channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup-node

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check Marketplace integration
        run: |
          pip install -r requirements-test.txt
          python -m ruff check custom_components scripts tests
          python -m pytest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release

      - name: Analyze Release
        id: release
        run: |
          RELEASE_VERSION=$([ -f RELEASE_VERSION ] && cat RELEASE_VERSION || echo '')
          RELEASE_CHANNEL=$([ -f RELEASE_CHANNEL ] && cat RELEASE_CHANNEL || echo '')
          RELEASE_RECOVERED=false

          # A rerun after an artifact upload failure must reuse the release tag at HEAD.
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_TAG=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1)
            if [ -n "$RELEASE_TAG" ]; then
              RELEASE_VERSION="${RELEASE_TAG#v}"
              RELEASE_RECOVERED=true

              if [[ "$RELEASE_VERSION" == *-* ]]; then
                RELEASE_CHANNEL=$(echo "$RELEASE_VERSION" | sed -E 's/^[^-]+-([^.]+).*/\1/')
              fi
            fi
          fi

          # Stable releases have no semantic-release channel.
          if [ -n "$RELEASE_VERSION" ] && [ -z "$RELEASE_CHANNEL" ]; then
            RELEASE_CHANNEL="latest"
          fi

          echo "release-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release-channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release-recovered=$RELEASE_RECOVERED" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Rebuild Existing Release Artifact
        if: ${{ steps.release.outputs.release-recovered == 'true' }}
        env:
          APP_VERSION: ${{ steps.release.outputs.release-version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run release:version "$APP_VERSION"
          pnpm run release:pack
          python3 scripts/package-marketplace.py --version "$APP_VERSION"
          python3 -m pytest
          gh release upload "v$APP_VERSION" ha_plus_matter_hub.zip --clobber

      - name: Package Artifact
        if: ${{ steps.release.outputs.release-version != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: marketplace-integration
          path: ha_plus_matter_hub.zip
      - name: Upload Documentation
        if: ${{ steps.release.outputs.release-version != '' && steps.release.outputs.release-channel == 'latest' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./docs/_build/html"

  publish-pages:
    name: "Publish Documentation"
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ needs.release.outputs.release-version != '' && needs.release.outputs.release-channel == 'latest' }}
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy documentation to GitHub Pages
        uses: actions/deploy-pages@v4
