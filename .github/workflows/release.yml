name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump after the latest release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run releases from the main branch." >&2
          exit 1
      - name: Prepare the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python scripts/release.py prepare "$BUMP"
      - name: Commit the version bump
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git diff --quiet; then
            echo "Version files already match ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha_plus_matter_hub/manifest.json package.json apps/*/package.json packages/*/package.json docs/package.json marketplace/package.json marketplace/package-lock.json
          git commit -m "chore: release ${TAG}"
          git push origin HEAD:main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Marketplace engine
        run: pnpm run release:pack
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
      - name: Build Marketplace archive
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/release.py package --tag "$TAG"
      - name: Create GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" ha_plus_matter_hub.zip \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --generate-notes

  package:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve engine version
        run: python -c "import json,os; v=json.load(open('custom_components/ha_plus_matter_hub/manifest.json'))['version']; open(os.environ['GITHUB_ENV'],'a').write('APP_VERSION='+v+'\n')"
      - name: Build Marketplace engine
        run: pnpm run release:pack
      - name: Build Marketplace archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release.py package --tag "$TAG"
      - uses: softprops/action-gh-release@v2
        with:
          files: ha_plus_matter_hub.zip
