name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install -r requirements-test.txt
      - run: python -m ruff check custom_components scripts tests
      - run: python -m pytest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:panel
      - run: pnpm run lint
      - run: pnpm run test
      - name: Resolve engine version
        run: python -c "import json,os; v=json.load(open('custom_components/ha_plus_matter_hub/manifest.json'))['version']; open(os.environ['GITHUB_ENV'],'a').write('APP_VERSION='+v+'\n')"
      - run: pnpm run release:pack
      - run: python scripts/release.py package
      - run: python -m pytest
      - uses: actions/upload-artifact@v5
        with:
          name: marketplace-integration
          path: ha_plus_matter_hub.zip
