name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: "Verify Code"
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.setup.outputs.node-version }}
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-node
        id: setup

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check Marketplace integration
        run: |
          pip install -r requirements-test.txt
          python -m ruff check custom_components scripts tests
          python -m pytest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Resolve Version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          echo "package-version=0.0.0-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Package Marketplace integration
        run: |
          python3 scripts/package-marketplace.py
          python -m pytest

      - name: Package Artifact
        uses: actions/upload-artifact@v5
        with:
          name: marketplace-integration
          path: ha_plus_matter_hub.zip
